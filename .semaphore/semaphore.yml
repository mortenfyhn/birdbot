# Set up to run with a Semaphore scheduled task

version: v1.0
name: Initial Pipeline

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

blocks:
  - name: 'Publish feed'
    task:
      secrets:
        - name: semaphore-birdbot-deploy
      jobs:
        - name: 'Update Atom feed'
          commands:
            - pip install bs4 requests
            - checkout
            - python publish_feed.py
            - git add docs/feed.xml docs/index.html
            - git config --global user.email "morten.fyhn.amundsen@gmail.com"
            - git config --global user.name "Morten Fyhn Amundsen"
            - 'git commit -m "Update feed" ||:'
            - chmod 600 ~/.ssh/id_ed25519
            - GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git push origin master
