# Set up to run with a Semaphore scheduled task

version: v1.0
name: Initial Pipeline

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

blocks:
  - name: 'Publish feed'
    task:
      jobs:
        - name: 'Update Atom feed'
          commands:
            - pip install bs4 requests
            - checkout
            - python publish_feed.py
            - cd "$SEMAPHORE_GIT_DIR"
            - git add docs/feed.xml docs/index.html
            - 'git diff --cached --quiet && echo "No changes" && exit 0'
            - git commit -m "Update feed"
            - git push origin master
